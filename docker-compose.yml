services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks_dev_password
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
