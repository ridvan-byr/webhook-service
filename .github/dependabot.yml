version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # These packages are versioned together with the .NET platform: EF Core, Npgsql's EF provider,
      # the Microsoft.Extensions and ASP.NET Core packages and the dotnet-ef tool. They have to move
      # together, so they share one pull request. Split up, a pull request such as the Npgsql one
      # would fail on its own until the EF Core one is merged.
      dotnet-platform:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "dotnet-ef"

      # Low-risk updates of everything else share one weekly pull request.
      # Major versions of these packages are NOT grouped: each one arrives as its own pull request,
      # so one incompatible package cannot block the others (this is what happened when a single
      # grouped pull request held thirteen updates and Swashbuckle 10 broke all of them).
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "dotnet-ef"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Packages that are held back on purpose, because the panel must still build and test on Node 20.18
    # (see "Node version and pinned packages" in docs/decisions/0007-admin-panel.md). Remove an entry
    # when the Node requirement moves up, otherwise its pull request fails in CI.
    ignore:
      # 4.3.4 and later load magic-string through require(), which is ESM-only and fails on Node 20.18.
      - dependency-name: "tailwindcss"
        versions: [">= 4.3.4"]
      - dependency-name: "@tailwindcss/*"
        versions: [">= 4.3.4"]
      # jsdom 26 and later need a newer Node than 20.18.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # ESLint 10 is not supported yet by eslint-plugin-jsx-a11y and the React and Next.js plugins
      # (npm stops with ERESOLVE). Revisit when their peer ranges include 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Vitest 5 needs Node 22.12 or later, and @vitejs/plugin-react 6 needs Vite 8 (its Rolldown binary does
      # not load on Node 20.18). They move together with Vite, so they are held back together.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript up to 6.0, so 6.1 and later (including 7) fail the lint step.
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]
      # The types describe the Node the panel runs on. The lowest supported Node is 20, so newer type
      # definitions would let code use APIs that do not exist there without any error.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Next.js and React are released together and their versions have to match.
      next-and-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "@types/react"
          - "@types/react-dom"

      # Tailwind and its build plugin have to have the same version.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

      # Low-risk updates of everything else share one weekly pull request.
      # Major versions of these packages are not grouped: each one arrives as its own pull request.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "@types/react"
          - "@types/react-dom"
          - "tailwindcss"
          - "@tailwindcss/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The base images of the containers. New .NET and Node major versions are a decision, not an update: .NET 8
  # is the version the code targets, and Node 24 is the one the panel is tested on, so only patch and minor
  # updates of those arrive on their own.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Dependabot names these images without the registry host (dotnet/sdk, dotnet/aspnet, dotnet/runtime), so
      # a pattern that starts with mcr.microsoft.com matches nothing; that let a jump from 8.0 to 10.0 through.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # The images named in the compose files (PostgreSQL, and Node for the demo receiver).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # A new RabbitMQ major version can change defaults (queue types, feature flags). Moving to one is a decision,
      # tested against the broker tests first, not an update.
      - dependency-name: "rabbitmq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
