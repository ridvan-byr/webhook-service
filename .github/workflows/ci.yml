name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The persistence and API tests start PostgreSQL in a container with Testcontainers.
      # GitHub's Ubuntu runners have Docker installed, so no extra service is needed.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
